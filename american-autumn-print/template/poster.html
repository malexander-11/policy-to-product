<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Matt &amp; Billy’s American Autumn — A5 print</title>
<style>
{{fonts}}
{{css}}
</style>
</head>
<body>
<div class="sheet"><div class="art">
  <header class="title">
    <h1>{{title}}</h1>
    <p class="sub">{{subtitle}}</p>
  </header>

  <div class="card">
    <i class="tape tl"></i><i class="tape tr"></i><i class="tape bl"></i><i class="tape br"></i>
    {{map}}
  </div>

  <footer class="foot">
    <div><div class="stats">{{stats}}</div><span class="credit">{{credit}}</span></div>
    <div class="hand">{{hand}}</div>
  </footer>
</div></div>
</body>
</html>
