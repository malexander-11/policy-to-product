<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>An American Autumn — Interactive Route</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --rust:#B7410E; --rust-dk:#7A2C0A; --ink:#1A1A1A;
    --parch:#F3E8DF; --paper:#FBF7F2; --line:#D8C3B3; --navy:#2E4A6B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:var(--paper);}
  header{border-bottom:3px solid var(--rust);padding:14px 20px;}
  h1{margin:0 0 3px;color:var(--rust-dk);font-size:24px;}
  .sub{color:#8A6D5B;font-style:italic;font-size:14px;}
  .shell{position:relative;height:calc(100vh - 64px);min-height:520px;overflow:hidden;}
  #map{position:absolute;inset:0;}
  #panel{
    position:absolute;top:0;right:0;height:100%;width:380px;max-width:88vw;
    background:var(--paper);border-left:1px solid var(--line);
    box-shadow:-6px 0 24px rgba(0,0,0,.18);
    transform:translateX(100%);transition:transform .32s ease;
    overflow-y:auto;z-index:1000;
  }
  #panel.open{transform:translateX(0);}
  .p-head{position:sticky;top:0;background:var(--rust);color:#fff;padding:16px 18px;}
  .p-num{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;
    background:#fff;color:var(--rust-dk);border-radius:50%;font-family:Arial;font-size:13px;font-weight:bold;margin-right:8px;}
  .p-title{font-size:20px;font-weight:bold;vertical-align:middle;}
  .p-dates{font-size:13px;opacity:.92;margin-top:5px;font-style:italic;}
  .p-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.2);border:none;color:#fff;
    width:26px;height:26px;border-radius:50%;font-size:16px;cursor:pointer;line-height:1;}
  .p-body{padding:16px 18px 40px;}
  .p-tag{display:inline-block;background:var(--parch);color:var(--rust-dk);font-size:11px;
    font-family:Arial;padding:3px 9px;border-radius:10px;margin-bottom:12px;}
  .p-lead{font-size:14.5px;line-height:1.6;margin:0 0 14px;}
  .sect{margin:14px 0 4px;font-size:13px;font-weight:bold;color:var(--rust-dk);
    border-bottom:1px solid var(--line);padding-bottom:3px;font-family:Arial;text-transform:uppercase;letter-spacing:.3px;}
  ul.do{margin:6px 0 0;padding-left:18px;}
  ul.do li{font-size:13.5px;line-height:1.5;margin-bottom:5px;}
  .drive{font-size:12.5px;color:#6B5847;background:#FAF3EC;border-radius:6px;padding:7px 10px;margin:4px 0 12px;}
  .drive b{color:var(--rust-dk);}
  .check{font-size:12.5px;color:var(--navy);background:#EAF0F6;border-radius:6px;padding:7px 10px;margin-top:6px;line-height:1.5;}
  .check b{color:var(--navy);}
  .maybe{font-size:12.5px;color:var(--rust-dk);background:var(--parch);border:1px dashed var(--line);
    border-radius:6px;padding:7px 10px;margin-top:6px;line-height:1.5;}
  .maybe b{color:var(--rust-dk);}
  .hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:600;
    background:var(--rust-dk);color:#fff;font-size:12.5px;padding:7px 14px;border-radius:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.3);font-family:Arial;}
  .leaflet-popup-content{font-family:Georgia,serif;}
</style>
</head>
<body>
<header>
  <h1>An American Autumn</h1>
  <div class="sub">Washington DC &#8594; Boston &#183; 27 Sept &#8211; 10 Oct 2026 &#183; tap any stop for the plan</div>
</header>
<div class="shell">
  <div id="map"></div>
  <div class="hint" id="hint">Tap a numbered pin to see the plans &#8594;</div>
  <aside id="panel">
    <div class="p-head">
      <button class="p-close" onclick="closePanel()">&#215;</button>
      <span class="p-num" id="pNum"></span><span class="p-title" id="pTitle"></span>
      <div class="p-dates" id="pDates"></div>
    </div>
    <div class="p-body" id="pBody"></div>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const stops = [
  {
    name:"Washington DC", lat:38.9072873, lng:-77.0369274, dates:"Sun 27 Sept \u2013 Thu 1 Oct \u00b7 4 nights",
    tag:"Fly in \u00b7 political heritage",
    lead:"The political pilgrimage. Base on Capitol Hill or Penn Quarter and walk into it \u2014 park the car and leave it until you head north.",
    arrive:null,
    plans:["Day 1: arrive, walk the National Mall at dusk \u2014 Lincoln Memorial, the war memorials, Washington Monument",
      "Capitol Hill day \u2014 Capitol tour, Library of Congress (Jefferson Building), Supreme Court",
      "National Archives at opening \u2014 the Constitution, Declaration, Bill of Rights",
      "American History museum; White House view from Lafayette Square",
      "One heavy museum: Holocaust Memorial or African American History & Culture",
      "Ford's Theatre ties the Lincoln thread together; Jefferson & FDR memorials after dark",
      "⚾ Sun 27 Sept is the MLB regular-season finale — Nationals vs Mets, a short Metro ride from the Mall. Usually a mid-afternoon start, so it lives or dies on your landing time"],
    check:"The extra night fixes the squeeze \u2014 an arrival evening plus THREE full days (28th, 29th, 30th), so the list above now fits without cutting. Optional extra gig: 9:30 Club (930.com) or The Anthem."
  },
  {
    name:"Gettysburg", lat:39.8309293, lng:-77.2310955, dates:"Thu 1 Oct \u00b7 morning",
    tag:"Battlefield + national park",
    lead:"The heritage capstone, now in morning light and far quieter for it. You read the Address in marble on day one; here you stand where Lincoln spoke it.",
    arrive:["DC \u2192 Gettysburg","~85 mi","1h 45m"],
    plans:["Leave DC early \u2014 aim to be at the Visitor Center for opening",
      "Museum & Visitor Center \u2014 the film and the Cyclorama",
      "Auto tour of the battlefield \u2014 Little Round Top, the High Water Mark, the Soldiers' National Cemetery",
      "A licensed battlefield guide who rides in your car is the splurge-worthy way to do it",
      "Lunch in town, then push north by ~2pm \u2014 it's a long afternoon on"],
    check:"Book the in-car licensed guide ahead \u2014 they fill up, and the morning slots go first."
  },
  {
    name:"Delaware Water Gap", lat:40.9723, lng:-75.1352, dates:"Thu 1 Oct \u00b7 afternoon leg-stretch",
    tag:"Breaking the long drive",
    lead:"Honestly a drive-through \u2014 I-80 runs straight through the gap in the ridge. But twenty minutes at an overlook turns the day's dead afternoon into a drive with a middle, and it costs almost nothing: routed this way the leg comes out about the same as going direct.",
    arrive:["Gettysburg \u2192 Water Gap","~150 mi","2h 30m"],
    plans:["Point of Gap Overlook on PA Route 611, or Kittatinny Point on the NJ side \u2014 both minutes off the interstate",
      "Mount Tammany is the real hike here, but it's 3.5 hrs and you don't have that today",
      "Sunset is 18:43 \u2014 this is the last usable daylight you'll get"]
  },
  {
    name:"Hyde Park \u2014 FDR", lat:41.7670, lng:-73.9330, dates:"Thu 1 Oct night \u00b7 Fri 2 Oct morning",
    tag:"Springwood & the first presidential library",
    lead:"Sleeping here instead of Cold Spring is the whole trick. Thursday night was always dinner-and-bed \u2014 you arrive after dark either way \u2014 so moving the bed 40 minutes north costs you nothing and puts you at the Visitor Center door as it opens.",
    arrive:["Water Gap \u2192 Hyde Park","~100 mi","2h"],
    plans:["Thu: in around 19:15, dark. Sleep in Rhinebeck 15 min north \u2014 a far better village than Poughkeepsie, and the Beekman Arms there claims to be America's oldest continuously operating inn (1766)",
      "Fri 09:00: be at the Visitor Center when it opens \u2014 Springwood mansion tours are ranger-guided, same-day, first-come-first-served. No advance booking and no cash",
      "Springwood \u2014 FDR's birthplace, his home all his life, and where he and Eleanor are buried in the rose garden",
      "The FDR Presidential Library & Museum \u2014 the first ever built, and he designed it himself. Open to 18:00 through October",
      "Away by ~11:30 for West Point",
      "Thematic bonus: FDR's administration convened Bretton Woods in 1944. You'll be standing in the Gold Room on Sunday"],
    check:"The mansion is the one bit you can't book ahead \u2014 09:00 sharp or take your chances. The Library needs no ticket."
  },
  {
    name:"West Point", lat:41.3889257, lng:-73.9571178, dates:"Fri 2 Oct \u00b7 midday",
    tag:"Military Academy tour",
    lead:"Shifted to a midday slot so Springwood can have the morning. Academy at lunchtime, stadium at night \u2014 and you still keep both.",
    arrive:["Hyde Park \u2192 West Point","~30 mi","45m"],
    plans:["Book a ~12:30 tour (advance only, photo ID required \u2014 you can't drive on without it)",
      "Oldest continuously occupied military post in America",
      "Trophy Point \u2014 extraordinary Hudson views in autumn",
      "Away by ~14:30: Foxborough is 3h east, putting you there ~17:30 for a 19:00 show"],
    check:"Take a midday slot, NOT a morning one \u2014 the morning belongs to Springwood now. Advance-booking only, limited slots."
  },
  {
    name:"Foxborough \u2014 Gillette Stadium", lat:42.0909458, lng:-71.2643245, dates:"Fri 2 Oct \u00b7 Zach Bryan, 7pm",
    tag:"Stadium night \u00b7 the new centrepiece",
    lead:"Zach Bryan's 'With Heaven On Tour' at Gillette, with Gregory Alan Isakov and Gabriella Rose supporting. Stadium-scale Americana on a Friday night \u2014 the most American evening of the trip, and it settles the live-music question in one go.",
    arrive:["West Point \u2192 Foxborough","~175 mi","3h"],
    plans:["Straight from the Academy \u2014 away ~14:30, Foxborough by ~17:30, comfortably ahead of doors",
      "Gillette's lots open early and tailgating is very much the done thing",
      "Sleep in Providence (~25 min south) \u2014 far easier after the show than fighting north into Boston, and a good dinner town",
      "Alternative: Foxborough or Mansfield, but those sell out for stadium shows",
      "No Patriots home game falls inside the trip — they're home 11 and 18 Oct, both after you fly. The concert is what Gillette gives you"],
    check:"Tickets and the bed on the same day \u2014 Providence and Foxborough lodging both go fast for a Gillette night."
  },
  {
    name:"Castle in the Clouds", lat:43.7419, lng:-71.3286, dates:"Sat 3 Oct \u00b7 en route north",
    tag:"The inland route",
    lead:"Inland up I-93 rather than the coast \u2014 the better road, and marginally shorter into the bargain. A 1913 mountaintop estate above Lake Winnipesaukee, with what may be the finest lake view in New Hampshire.",
    arrive:["Providence \u2192 Castle in the Clouds","~155 mi","2h 40m"],
    plans:["Lucknow Mansion tours \u2014 the Plant estate, restored",
      "Caf\u00e9 on the terrace with the Winnipesaukee view \u2014 a good lunch stop",
      "Season runs to 25 Oct, so the 3rd sits comfortably inside it",
      "Away by ~14:00: Bretton Woods is 1h20 on and sunset is 18:22"],
    check:"Leave Providence by ~09:00 to get two unhurried hours here."
  },
  {
    name:"Bretton Woods \u2014 Mount Washington", lat:44.2581, lng:-71.4409, dates:"Sat 3 \u2013 Mon 5 Oct \u00b7 2 nights",
    tag:"Where the postwar order was written",
    lead:"The best thematic find of the whole trip. In July 1944, delegates from 44 nations spent three weeks at this hotel and came out with the IMF, the World Bank and the dollar as the anchor of international exchange. You open in Washington among the institutions the Founders built; here you stand in the room where the postwar economic order was.",
    arrive:["Castle in the Clouds \u2192 Bretton Woods","~65 mi","1h 20m"],
    plans:["\ud83c\udfdb The Gold Room \u2014 signed 22 July 1944, preserved off the lobby as a small museum",
      "Mount Washington Cog Railway \u2014 the base station is ~10 min from the hotel",
      "Franconia Notch, 35 min west \u2014 Flume Gorge and the Cannon Mountain tramway",
      "The hotel is the point in itself: a grand 1902 pile with a veranda built for exactly this week of the year"],
    check:"The Omni is the splurge end of this trip. If two nights is too rich, take one here and two in Conway instead."
  },
  {
    name:"North Conway", lat:44.0537, lng:-71.1281, dates:"Mon 5 \u2013 Tue 6 Oct \u00b7 1 night",
    tag:"Crawford Notch & the Kanc",
    lead:"You cross the range eastward on Route 302 through Crawford Notch \u2014 one of the great New England roads \u2014 and come down on the Conway side for the Kancamagus.",
    arrive:["Bretton Woods \u2192 North Conway","~40 mi","50m"],
    plans:["Crawford Notch on Rt 302 \u2014 Silver Cascade, the Willey House, the whole run of the notch",
      "Mount Willard \u2014 trailhead right on the notch, an hour up for one of the best views in the Whites",
      "The Kancamagus Highway ('the Kanc') in the afternoon \u2014 the most famous foliage drive in New England (fuel up; no petrol stations)"],
    check:"Peak-foliage week is the busiest of the New England year \u2014 book both mountain beds now."
  },
  {
    name:"Fryeburg Fair", lat:44.0206, lng:-70.9789, dates:"Tue 6 Oct \u00b7 on the way to Portland",
    tag:"Maine's biggest agricultural fair",
    lead:"The fair runs 4\u201311 October and you drive straight through Fryeburg on the 6th. No detour, no extra miles \u2014 ox pulling, livestock barns, harness racing, fried dough. A proper American autumn morning that fell into your lap.",
    arrive:["North Conway \u2192 Fryeburg","~20 mi","25m"],
    plans:["Ox and horse pulling, the livestock barns, the midway",
      "Harness racing on the track",
      "Give it the morning and early afternoon, then run on to Portland"],
    check:"fryeburgfair.org for the day's schedule \u2014 it's the largest fair in Maine and the parking fields fill early."
  },
  {
    name:"Portland, Maine", lat:43.670822, lng:-70.2843825, dates:"Tue 6 \u2013 Fri 9 Oct \u00b7 3 nights",
    tag:"Coast + campaign trail",
    lead:"Southern Maine \u2014 good food city, walkable Old Port, lobster everywhere, and the centre of a contested midterm autumn. The third night matters here: campaign events surface at short notice, and slack is what lets you chase one.",
    arrive:["Fryeburg \u2192 Portland","~50 mi","1h"],
    plans:["Tue PM: in from the fair \u2014 settle into the Old Port and the working waterfront",
      "Wed: Portland Head Light at Cape Elizabeth, then the city \u2014 this is a genuinely excellent eating and brewing town, and that's a legitimate way to spend a day",
      "Thu day trip: Boothbay Harbour (1h20) or Camden (2h \u2014 Mount Battie over Penobscot Bay) for coast that beats Portland's own",
      "Thu inland alternative: Sabbathday Lake Shaker Village, 40 min out \u2014 the last active Shaker community in the world",
      "Campaign trail: Maine has live Senate (Collins vs Platner) AND Governor (open seat) races"],
    check:"After three days of mountains, take the coast on Thursday for contrast. Campaign events: candidate socials, Portland Press Herald, Maine Public ~1\u20132 weeks out."
  },
  {
    name:"Salem, MA", lat:42.5195, lng:-70.8967, dates:"Fri 9 Oct \u00b7 afternoon",
    tag:"The autumnal stop",
    lead:"Directly on the Portland\u2013Boston road, and Haunted Happenings runs the whole of October. Salem in the first half of October, at dusk, is about as autumnal as New England gets.",
    arrive:["Portland \u2192 Salem","~85 mi","1h 35m"],
    plans:["The old town, Derby Wharf, the House of the Seven Gables",
      "Haunted Happenings is city-wide through October \u2014 street theatre, markets, the lot",
      "It's Salem's 400th anniversary year, so there's rather more on than usual"],
    check:"Friday is busy but survivable \u2014 the real crushes are weekends and Halloween night."
  },
  {
    name:"Boston", lat:42.3555076, lng:-71.0565364, dates:"Fri 9 \u2013 Sat 10 Oct \u00b7 1 night",
    tag:"The Revolutionary finish \u00b7 fly home",
    lead:"The loop closes with no backtracking. You opened in the capital the Founders built; you close where the Revolution began, with an Original Six matinee before the flight.",
    arrive:["Salem \u2192 Boston","~20 mi","35m"],
    plans:["Fri ~16:00: in from Salem, drop the car (Boston's walkable; Logan's on the subway)",
      "Fri late afternoon: the downtown half of the Freedom Trail \u2014 Boston Common, State House, Old State House & the Massacre site, Faneuil Hall \u2014 sunset is 18:12",
      "Sat morning: the North End half \u2014 Paul Revere's house, Old North Church \u2014 then over the bridge into Charlestown",
      "Sat: Bunker Hill Monument & USS Constitution \u2014 a 15-min walk from TD Garden",
      "\ud83c\udfd2 Sat 1pm: BRUINS vs FLYERS at TD Garden \u2014 walk back over the bridge for it",
      "~3:45pm final horn, then ~15 min to Logan for the 21:50 flight"],
    maybe:"If the Red Sox make the ALDS they'd host games 3 and 4 on 7\u20138 and 8\u20139 Oct \u2014 so Fenway on the Friday is live, and the Thursday game is drivable from Portland. Won't be known until the Wild Card round ends on 1 Oct.",
    check:"Adding Salem squeezes Friday: leave Portland by ~10:30 and you get Salem AND the downtown Freedom Trail before dark. Leave at 13:00 and Salem eats the whole afternoon, pushing all of the Trail into Saturday morning alongside Charlestown and a 13:00 face-off \u2014 which won't fit. TD Garden is North Station, ~15 min from Logan, so the game still leaves ~3 hours before check-in. Ask the hotel to hold bags on the Saturday."
  }
];

const map = L.map('map');
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  {attribution:'\u00a9 OpenStreetMap, \u00a9 CARTO', maxZoom:19}).addTo(map);

const latlngs = stops.map(s=>[s.lat,s.lng]);
L.polyline(latlngs,{color:'#B7410E',weight:3.5,opacity:.85}).addTo(map);

const markers = [];
stops.forEach((s,i)=>{
  const icon = L.divIcon({className:'',
    html:'<div style="background:#7A2C0A;color:#fff;width:28px;height:28px;border-radius:50%;'+
          'display:flex;align-items:center;justify-content:center;font-family:Arial;font-size:14px;'+
          'font-weight:bold;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:pointer">'+(i+1)+'</div>',
    iconSize:[28,28], iconAnchor:[14,14]});
  const m = L.marker([s.lat,s.lng],{icon}).addTo(map);
  m.on('click',()=>openPanel(i));
  markers.push(m);
});

for(let i=0;i<stops.length-1;i++){
  const a=latlngs[i], b=latlngs[i+1];
  const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
  const t=stops[i+1].arrive[2];
  const lbl=L.divIcon({className:'',
    html:'<div style="background:#FBF7F2;border:1px solid #B7410E;color:#7A2C0A;padding:1px 6px;'+
          'border-radius:10px;font-family:Arial;font-size:11px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.25)">'+t+'</div>',
    iconSize:[0,0], iconAnchor:[18,8]});
  L.marker(mid,{icon:lbl,interactive:false}).addTo(map);
}

map.fitBounds(latlngs,{padding:[40,60]});

function openPanel(i){
  const s = stops[i];
  document.getElementById('pNum').textContent = i+1;
  document.getElementById('pTitle').textContent = s.name;
  document.getElementById('pDates').textContent = s.dates;
  let html = '<div class="p-tag">'+s.tag+'</div><p class="p-lead">'+s.lead+'</p>';
  if(s.arrive){
    html += '<div class="drive">\uD83D\uDE97 Drive in \u2014 <b>'+s.arrive[0]+'</b>: '+s.arrive[1]+' \u00b7 <b>'+s.arrive[2]+'</b></div>';
  }
  html += '<div class="sect">What you\'re doing</div><ul class="do">';
  s.plans.forEach(p=> html += '<li>'+p+'</li>');
  html += '</ul>';
  if(s.maybe){
    html += '<div class="maybe"><b>◇ Maybe:</b> '+s.maybe+'</div>';
  }
  if(s.check){
    html += '<div class="check"><b>\u2713 Check / book:</b> '+s.check+'</div>';
  }
  document.getElementById('pBody').innerHTML = html;
  document.getElementById('panel').classList.add('open');
  document.getElementById('hint').style.display='none';
  map.panTo([s.lat,s.lng],{animate:true});
}
function closePanel(){
  document.getElementById('panel').classList.remove('open');
}
</script>
</body>
</html>
