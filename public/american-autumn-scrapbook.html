<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Gelasio:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap">

<!-- Served from GitHub Pages. Diary state lives in the aa-state script block
     as plain JSON; photos are JPEGs in scrapbook-media/. New entries are merged
     into that block only - keep the block and its exact opening tag intact. -->
<style>
  :root{
    --kraft:#C4A276; --page:#FCF8EE; --map-paper:#FBF4E4;
    --ink:#2E2419; --faint:#7A6955; --rust:#A63A0C; --rule:#E3D6BF;
    --tape:rgba(236,224,182,.82);
    color-scheme:light;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none!important;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;min-height:100vh;color:var(--ink);font:16.5px/1.65 Gelasio,Georgia,'Times New Roman',serif;
    background-color:var(--kraft);
    background-image:
      radial-gradient(circle at 30% 40%, rgba(90,60,25,.16) 0 .8px, transparent 1.2px),
      radial-gradient(circle at 70% 70%, rgba(255,240,210,.2) 0 .8px, transparent 1.2px),
      repeating-linear-gradient(115deg, rgba(90,60,25,.035) 0 2px, transparent 2px 7px);
    background-size:5px 6px, 7px 5px, auto;}
  a{color:var(--rust);}
  button{font:inherit;color:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--rust);outline-offset:3px;}

  /* one attachment method everywhere: masking tape */
  .tape{position:absolute;z-index:2;width:88px;height:24px;background:var(--tape);box-shadow:0 1px 2px rgba(60,40,15,.15);
    clip-path:polygon(2% 10%,6% 0,95% 6%,100% 14%,98% 88%,100% 100%,4% 94%,0 86%);}
  /* one ink stamp, reused */
  .stamp{display:inline-block;border:2.5px double var(--rust);border-radius:4px;color:var(--rust);
    font:13px/1 'Special Elite','Courier New',monospace;letter-spacing:.14em;text-transform:uppercase;
    padding:6px 9px 5px;transform:rotate(-6deg);mix-blend-mode:multiply;opacity:.9;}
  .label{font:12px/1.5 'Special Elite','Courier New',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);text-wrap:balance;}

  /* ---------- the page ---------- */
  .page{position:relative;max-width:780px;margin:18px 10px 36px;padding:34px 20px 28px;background:var(--page);box-shadow:0 12px 34px rgba(60,40,15,.38);}
  @media (min-width:660px){.page{margin:34px auto 60px;padding:48px 48px 36px;}}
  @media (min-width:660px) and (max-width:820px){.page{margin-left:20px;margin-right:20px;}}
  .head{text-align:center;}
  .head h1{margin:0;font:700 clamp(54px,13vw,80px)/.95 Caveat,cursive;color:var(--rust);text-wrap:balance;}
  .head .label{margin:12px 0 0;}
  .status{margin:14px auto 0;max-width:34em;font-style:italic;text-wrap:balance;}
  .nav{display:flex;justify-content:center;gap:24px;margin:18px 0 0;}
  .nav button{border:0;background:none;padding:4px 2px;color:var(--rust);
    font:14px/1.2 'Special Elite','Courier New',monospace;letter-spacing:.12em;text-transform:uppercase;
    text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px;}
  .nav button[aria-pressed="true"]{text-decoration-thickness:3px;}

  /* ---------- the map ---------- */
  .mapcard{position:relative;max-width:640px;margin:36px auto 0;padding:9px;background:var(--map-paper);box-shadow:0 6px 16px rgba(60,40,15,.28);transform:rotate(-.4deg);}
  .mapcard .tape.l{top:-9px;left:-22px;transform:rotate(-34deg);}
  .mapcard .tape.r{top:-9px;right:-22px;transform:rotate(34deg);}
  .mapfold{position:relative;}
  .mapfold::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(90deg,transparent calc(50% - 1px),rgba(80,50,20,.09) calc(50% - 1px),rgba(255,255,255,.45) 50%,transparent calc(50% + 1.5px)),
      linear-gradient(180deg,transparent calc(50% - 1px),rgba(80,50,20,.08) calc(50% - 1px),rgba(255,255,255,.4) 50%,transparent calc(50% + 1.5px));}
  .mapcard svg{display:block;width:100%;height:auto;}
  .map-cap{margin:16px 0 0;text-align:center;text-wrap:balance;font:12.5px/1.6 'Special Elite','Courier New',monospace;color:var(--faint);}
  .map-cap i{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 5px 0 0;vertical-align:-1px;}
  .lbl{font:700 16px Gelasio,Georgia,serif;fill:#2E2419;paint-order:stroke;stroke:#FBF4E4;stroke-width:4px;stroke-linejoin:round;}
  .ann{font:700 23px Caveat,cursive;fill:#A63A0C;}
  .stop-hit{cursor:pointer;outline:none;}
  .stop-hit:focus-visible circle{stroke:#A63A0C;stroke-width:2.5;}

  /* ---------- a stop's page ---------- */
  #panel{margin-top:44px;scroll-margin-top:16px;}
  .stop-head{position:relative;border-top:1px solid var(--rule);padding-top:26px;}
  .stop-head h2,.view-h{margin:0;font:700 44px/1.05 Caveat,cursive;color:var(--ink);}
  .view-h{border-top:1px solid var(--rule);padding-top:26px;}
  .stop-title{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;}
  .facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:baseline;margin:14px 0 0;}
  .facts dd{margin:0;}
  .blurb{margin:12px 0 0;font-style:italic;}
  .day{margin-top:36px;}
  .day-h{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;border-bottom:1px solid var(--rule);padding-bottom:4px;}
  .day-h b{font:700 32px/1.1 Caveat,cursive;color:var(--rust);}
  .entry{margin-top:18px;}
  .entry h3{margin:0;font:700 29px/1.1 Caveat,cursive;}
  .day-h .stamp{margin-left:auto;padding:4px 6px 3px;font-size:11px;}
  .entry p{margin:6px 0 0;white-space:pre-wrap;}
  .empty{margin:30px 0 0;text-align:center;font:25px/1.3 Caveat,cursive;color:var(--faint);}
  .prints{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 18px;margin:24px 0 6px;}
  .prints:not(.wall) .print:last-child:nth-child(odd){grid-column:1 / -1;justify-self:center;width:calc(50% - 9px);}
  @media (min-width:660px){.prints.wall{grid-template-columns:repeat(3,minmax(0,1fr));}}
  .print{position:relative;margin:0;background:#fff;padding:8px 8px 6px;box-shadow:0 4px 12px rgba(60,40,15,.28);}
  .print:nth-child(odd){transform:rotate(-1.4deg);}
  .print:nth-child(even){transform:rotate(1.2deg);}
  .print .tape{top:-12px;left:50%;width:78px;height:22px;margin-left:-39px;transform:rotate(-4deg);}
  .print img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#E8DFD0;cursor:zoom-in;}
  .print img.missing{cursor:default;}
  .print figcaption{min-height:30px;padding:8px 2px 2px;font:21px/1.15 Caveat,cursive;}
  .print figcaption .label{display:block;margin-top:2px;font-size:10.5px;}
  .pager{display:flex;justify-content:space-between;gap:16px;margin:42px 0 0;padding-top:16px;border-top:1px solid var(--rule);}
  .pager button{border:0;background:none;padding:4px 0;color:var(--rust);text-align:left;
    font:13px/1.4 'Special Elite','Courier New',monospace;letter-spacing:.05em;text-decoration:underline;text-underline-offset:4px;}
  .pager button:last-child{text-align:right;}

  /* ---------- footer ---------- */
  .foot{margin-top:48px;padding-top:16px;border-top:1px solid var(--rule);text-align:center;
    font:12.5px/1.8 'Special Elite','Courier New',monospace;color:var(--faint);}

  /* ---------- a photo, enlarged ---------- */
  #lb{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    padding:20px;background:rgba(30,20,10,.86);cursor:zoom-out;}
  .lb-print{margin:0;max-width:min(92vw,720px);background:#fff;padding:10px 10px 12px;box-shadow:0 14px 40px rgba(0,0,0,.55);}
  .lb-print img{display:block;max-width:100%;max-height:72vh;margin:0 auto;}
  .lb-print figcaption{padding-top:8px;text-align:center;font:24px/1.2 Caveat,cursive;}
  .lb-hint{font:12px 'Special Elite','Courier New',monospace;color:#E9DCC3;}

  @keyframes pulse{0%{transform:scale(.6);opacity:.9;}70%{transform:scale(2.1);opacity:0;}100%{transform:scale(2.1);opacity:0;}}
  .pin-pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite;}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<script id="aa-state" type="application/json">{"entries":[{"id":"d1-arrival","day":1,"title":"","text":"Despite the “lost passport” episode and an hour’s delay on the tarmac, our transatlantic journey was smooth. We arrived at 9pm local time and headed straight to bed.","photos":[],"ts":1790630685200},{"id":"d2-mall-and-archives","day":2,"title":"","text":"The jet lag worked in our favour: awake at 6am and ready to carpe the diem. Drip coffee and a lox bagel made for a wonderfully American start in the lovely diner pictured below.","photos":[{"thumb":"scrapbook-media/018e0320e336e4cd-t.jpg","full":"scrapbook-media/018e0320e336e4cd-f.jpg","w":1200,"h":1600,"cap":"Lox bagels at the Gallery Café"},{"thumb":"scrapbook-media/50896a59b0034500-t.jpg","full":"scrapbook-media/50896a59b0034500-f.jpg","w":1200,"h":1600,"cap":"Two lox, clearly labelled"}],"ts":1790630685201},{"id":"d2-lunch","day":2,"title":"","text":"All that walking called for a substantial lunch, and my burrito certainly delivered.","photos":[{"thumb":"scrapbook-media/f148f945d2f49860-t.jpg","full":"scrapbook-media/f148f945d2f49860-f.jpg","w":1200,"h":1600,"cap":"The burrito, with Gaviscon on standby"}],"ts":1790631003640},{"id":"d2-portrait-gallery","day":2,"title":"","text":"Refuelled, we headed to the National Portrait Gallery. It was a great way to take in the grand sweep of American history, with plenty of familiar faces alongside some interesting new perspectives.","photos":[{"thumb":"scrapbook-media/b7270300db95ac4e-t.jpg","full":"scrapbook-media/b7270300db95ac4e-f.jpg","w":1200,"h":1600,"cap":"“Out of Darkness Into Light”"},{"thumb":"scrapbook-media/0d4fa88a5bc49a53-t.jpg","full":"scrapbook-media/0d4fa88a5bc49a53-f.jpg","w":1600,"h":1200,"cap":"Nixon, by Norman Rockwell"},{"thumb":"scrapbook-media/a19108c5ab11f8b4-t.jpg","full":"scrapbook-media/a19108c5ab11f8b4-f.jpg","w":1200,"h":1600,"cap":"Richard Feynman at the blackboard"},{"thumb":"scrapbook-media/790f04f7d814500e-t.jpg","full":"scrapbook-media/790f04f7d814500e-f.jpg","w":1200,"h":1600,"cap":"Obama, by Kehinde Wiley"}],"ts":1790631003641},{"id":"d2-archives","day":2,"title":"","text":"Next we headed to the National Archive, where we survived the indignity of an exhibition about the divorce between our nations 250 years ago. The archival film footage of government messaging and patents of US inventions were fascinating.\n\nWith 25,000 steps behind us, we retreated to base for a breather before our evening plans.","photos":[{"thumb":"scrapbook-media/febcf504ad9c7fba-t.jpg","full":"scrapbook-media/febcf504ad9c7fba-f.jpg","w":1200,"h":1600,"cap":"“142 years young and going strong!” — July 4th, 1918"},{"thumb":"scrapbook-media/95547edf0a13d956-t.jpg","full":"scrapbook-media/95547edf0a13d956-f.jpg","w":1200,"h":1600,"cap":"Jack Kilby’s microchip patent, 1964"}],"ts":1790631003642},{"id":"d2-monuments","day":2,"title":"","text":"We then spent four hours walking around DC, taking in the White House (heavily securitised), the Washington Monument (once the world’s tallest structure), and the Reflecting Pool (sans water).\n\nThe Lincoln Memorial was awesome in the classic sense of the word. The Korean memorial exhibit is cleverly done and I was shocked by the sheer number of UN victims. The Vietnam Veterans Memorial was more sobering, particularly seeing two veterans clearly moved by their visit. We continued around the MLK and FDR memorials before making our way to the Jefferson portico.","photos":[{"thumb":"scrapbook-media/0f2616a67cd3746b-t.jpg","full":"scrapbook-media/0f2616a67cd3746b-f.jpg","w":1200,"h":1600,"cap":"The Washington Monument"},{"thumb":"scrapbook-media/bb67da6ad000aacc-t.jpg","full":"scrapbook-media/bb67da6ad000aacc-f.jpg","w":1200,"h":1600,"cap":"“I have a dream” — and the Reflecting Pool, sans water"},{"thumb":"scrapbook-media/bdac3f356449b2a6-t.jpg","full":"scrapbook-media/bdac3f356449b2a6-f.jpg","w":1600,"h":1200,"cap":"The two of us, and Abe"},{"thumb":"scrapbook-media/a776b07f3a0ecadd-t.jpg","full":"scrapbook-media/a776b07f3a0ecadd-f.jpg","w":1600,"h":1200,"cap":"On patrol at the Korean War Veterans Memorial"},{"thumb":"scrapbook-media/a16604610fe04d03-t.jpg","full":"scrapbook-media/a16604610fe04d03-f.jpg","w":1600,"h":1200,"cap":"The Korean War’s toll, at the Pool of Remembrance"},{"thumb":"scrapbook-media/06afcce203666568-t.jpg","full":"scrapbook-media/06afcce203666568-f.jpg","w":1200,"h":1600,"cap":"A letter left at the Vietnam Wall for Peter Kmetyk"}],"ts":1790631003639},{"id":"d2-off-the-record","day":2,"title":"","text":"We ventured back out into the evening to Off the Record, a politically themed bar by the White House. Bustling with staffers and decorated with political caricatures, I think we will be going back before we leave DC.","photos":[{"thumb":"scrapbook-media/7fc724e23f847744-t.jpg","full":"scrapbook-media/7fc724e23f847744-f.jpg","w":1200,"h":1600,"cap":"The White House by night"},{"thumb":"scrapbook-media/552d82f2307f726e-t.jpg","full":"scrapbook-media/552d82f2307f726e-f.jpg","w":1600,"h":1200,"cap":"The caricature wall at Off the Record"},{"thumb":"scrapbook-media/5c7cee15c2abf1f9-t.jpg","full":"scrapbook-media/5c7cee15c2abf1f9-f.jpg","w":1200,"h":1600,"cap":"Souvenir secured"}],"ts":1790679920885},{"id":"d2-old-ebbitt","day":2,"title":"","text":"After a couple of drinks and with a few placemats secured as souvenirs, we headed to the Old Ebbitt Grill for dinner. This was a bustling bar and restaurant which served us crab cakes and conversation at the bar, where our Californian neighbours turned out to have once done a house swap with a family in Guildford.","photos":[{"thumb":"scrapbook-media/571d5a6750dfc323-t.jpg","full":"scrapbook-media/571d5a6750dfc323-f.jpg","w":1200,"h":1600,"cap":"The Old Ebbitt Grill in full swing"},{"thumb":"scrapbook-media/5b1e30cc7c5a5cae-t.jpg","full":"scrapbook-media/5b1e30cc7c5a5cae-f.jpg","w":1200,"h":1600,"cap":"The view from our bar stools"}],"ts":1790679920886},{"id":"d2-bedtime","day":2,"title":"","text":"Now it really was time for bed.","photos":[],"ts":1790680016694},{"id":"d3-morning-run","day":3,"title":"","text":"Jet lag once again got us up bright and early. I headed out for a morning run while Billy went for a swim. The National Mall makes a spectacular running route, stretching from the Lincoln Memorial (hi again!) all the way to the Capitol (see you later!).","photos":[{"thumb":"scrapbook-media/82cb10f5b7397db7-t.jpg","full":"scrapbook-media/82cb10f5b7397db7-f.jpg","w":1200,"h":1600,"cap":"Hi again, Abe"},{"thumb":"scrapbook-media/b3cda6872854a759-t.jpg","full":"scrapbook-media/b3cda6872854a759-f.jpg","w":1200,"h":1600,"cap":"See ya later, Capitol"}],"ts":1790684881954},{"id":"d3-union-station","day":3,"title":"","text":"Today was all about the Capitol, so once we were ready, we got on the subway and headed over. This also gave us a chance to see the gorgeous Union Station. The marble floors certainly get polished!","photos":[{"thumb":"scrapbook-media/cd4c67221fd9b1d6-t.jpg","full":"scrapbook-media/cd4c67221fd9b1d6-f.jpg","w":1200,"h":1600,"cap":"Union Station, freshly polished"},{"thumb":"scrapbook-media/13bc629bb1c8b26f-t.jpg","full":"scrapbook-media/13bc629bb1c8b26f-f.jpg","w":1200,"h":1600,"cap":"Outside Union Station, the Capitol in sight"}],"ts":1790716029849},{"id":"d3-senate-and-library","day":3,"title":"","text":"We then took our seats in the Senate gallery, where a senator from Vermont was seeking to reverse Trump’s tariffs on Canada. Unsurprisingly, he didn’t get very far.\n\nAfter a further mooch around the exhibitions, the House and the gift shop, we headed to the Library of Congress. This was a complete surprise: jaw-droppingly beautiful and an absolute must-visit.","photos":[{"thumb":"scrapbook-media/6142ff7a3ee466cb-t.jpg","full":"scrapbook-media/6142ff7a3ee466cb-f.jpg","w":1200,"h":1600,"cap":"Jaw-dropping: the Library of Congress"}],"ts":1790716029851},{"id":"d3-capitol-hill-verdict","day":3,"title":"","text":"Capitol Hill certainly didn’t disappoint. A wonderfully welcoming and engaging place to spend the day.","photos":[],"ts":1790716029853},{"id":"d3-capitol-tour","day":3,"title":"","text":"After a short queue, we toured the building, with a film in the theatre as part of the experience. My highlight was the statue of Ronald Reagan in the beautiful rotunda, with fragments of the Berlin Wall built into its base.","photos":[{"thumb":"scrapbook-media/569246c0e087bd7c-t.jpg","full":"scrapbook-media/569246c0e087bd7c-f.jpg","w":1600,"h":1200,"cap":"The Capitol, under dramatic skies"},{"thumb":"scrapbook-media/038244417a3f65c8-t.jpg","full":"scrapbook-media/038244417a3f65c8-f.jpg","w":1200,"h":1600,"cap":"The Rotunda: history, painted big"},{"thumb":"scrapbook-media/7305beb6fbf901a2-t.jpg","full":"scrapbook-media/7305beb6fbf901a2-f.jpg","w":1200,"h":1600,"cap":"Looking up at the Apotheosis of Washington"},{"thumb":"scrapbook-media/67a95716e70bd2c2-t.jpg","full":"scrapbook-media/67a95716e70bd2c2-f.jpg","w":1200,"h":1600,"cap":"Reagan, standing on pieces of the Berlin Wall"},{"thumb":"scrapbook-media/4638fcfb8afb8b80-t.jpg","full":"scrapbook-media/4638fcfb8afb8b80-f.jpg","w":1200,"h":1600,"cap":"Arizona’s Barry Goldwater"}],"ts":1790716029850},{"id":"d3-supreme-court","day":3,"title":"","text":"We rounded off the visit with a look at the Supreme Court and a wander around the botanical gardens before heading home.","photos":[{"thumb":"scrapbook-media/6f049d758f52f4d5-t.jpg","full":"scrapbook-media/6f049d758f52f4d5-f.jpg","w":1200,"h":1600,"cap":"Equal Justice Under Law"},{"thumb":"scrapbook-media/816772b067334b20-t.jpg","full":"scrapbook-media/816772b067334b20-f.jpg","w":1200,"h":1600,"cap":"Goodbye, Capitol"}],"ts":1790716029852},{"id":"d3-georgetown","day":3,"title":"","text":"After a quick refresh, we were out to Georgetown to experience a more livable and lively neighbourhood. We started at a bar called The Sovereign where we enjoyed their extensive beer list.","photos":[{"thumb":"scrapbook-media/821b0b809310c680-t.jpg","full":"scrapbook-media/821b0b809310c680-f.jpg","w":1600,"h":1200,"cap":"The Sovereign’s wall of taps"}],"ts":1790798922267},{"id":"d3-martins-tavern","day":3,"title":"","text":"We then headed to Martin’s Tavern. This is where JFK proposed to Jackie and we had our photo in that booth. I enjoyed a delicious massive fillet of halibut on a bed of beet risotto, definitely the best food of the trip so far.","photos":[{"thumb":"scrapbook-media/1dd98538a3da21cb-t.jpg","full":"scrapbook-media/1dd98538a3da21cb-f.jpg","w":1600,"h":1200,"cap":"The two of us in the Proposal Booth"},{"thumb":"scrapbook-media/fe5d3cbcf420c2d3-t.jpg","full":"scrapbook-media/fe5d3cbcf420c2d3-f.jpg","w":1200,"h":1600,"cap":"The halibut: best of the trip so far"}],"ts":1790799582609},{"id":"d3-bedtime","day":3,"title":"","text":"Then, with jet lag catching up with us, it was time for bed.","photos":[],"ts":1790799582610},{"id":"d4-post-office-tower","day":4,"title":"","text":"Another jet lag induced early morning and we headed straight to the Old Post Office Tower for great views of DC. It was fascinating to see the scale of Arlington in the distance and the National Cathedral on the horizon.","photos":[{"thumb":"scrapbook-media/179ecf2b4bc6cb78-t.jpg","full":"scrapbook-media/179ecf2b4bc6cb78-f.jpg","w":1200,"h":1600,"cap":"Up the Old Post Office Tower"}],"ts":1790800161165},{"id":"d4-supreme-court","day":4,"title":"","text":"A revisit to the Supreme Court was next on the agenda with a fantastic museum downstairs and the most impressive marble forum leading to the courtroom.","photos":[{"thumb":"scrapbook-media/8ff9cb4d10774fc4-t.jpg","full":"scrapbook-media/8ff9cb4d10774fc4-f.jpg","w":1200,"h":1600,"cap":"The Supreme Court’s Great Hall"}],"ts":1790800161166},{"id":"d4-postal-museum","day":4,"title":"","text":"After a quick whizz around the US postal museum (fun fact 1: they used optical character recognition to sort mail as early as 1997) (fun fact 2: they deliver about half of the world’s mail), we grabbed a quick lunch and headed to Arlington.","photos":[{"thumb":"scrapbook-media/4f73cde11cf17667-t.jpg","full":"scrapbook-media/4f73cde11cf17667-f.jpg","w":1200,"h":1600,"cap":"Waffle ceilings on the Metro"}],"ts":1790800161167},{"id":"d4-arlington","day":4,"title":"","text":"Arlington was haunting in its beauty and its scale. The Unknown Soldier was particularly touching and we witnessed a changing of the guard.","photos":[{"thumb":"scrapbook-media/67628e5a00ba8ceb-t.jpg","full":"scrapbook-media/67628e5a00ba8ceb-f.jpg","w":1600,"h":1200,"cap":"Arlington National Cemetery"},{"thumb":"scrapbook-media/6a8b84b5ab5b7dfc-t.jpg","full":"scrapbook-media/6a8b84b5ab5b7dfc-f.jpg","w":1200,"h":1600,"cap":"Row upon row"}],"ts":1790800161168},{"id":"d4-myth-making","day":4,"title":"","text":"The national myth making stands out in DC in a way that just doesn’t exist back in the UK.","photos":[],"ts":1790800161169},{"id":"d4-sunset-stroll","day":4,"title":"","text":"After a short break, we headed back to Off the Record for a drink and to add to our collection of political placemats. From there, we took a sunset stroll around DC’s monuments, all bathed in a gorgeous orange and pink glow.","photos":[{"thumb":"scrapbook-media/96b5cbddaca3bb37-t.jpg","full":"scrapbook-media/96b5cbddaca3bb37-f.jpg","w":1200,"h":1600,"cap":"The Washington Monument at dusk"},{"thumb":"scrapbook-media/1d1f99b4ae1c1e9a-t.jpg","full":"scrapbook-media/1d1f99b4ae1c1e9a-f.jpg","w":1200,"h":1600,"cap":"The World War II Memorial at sunset"},{"thumb":"scrapbook-media/62ec1faa99ffd66e-t.jpg","full":"scrapbook-media/62ec1faa99ffd66e-f.jpg","w":1200,"h":1600,"cap":"Goodnight, Abe"}],"ts":1790853359753},{"id":"d4-last-night","day":4,"title":"","text":"A stop at a sports bar and another dinner at Old Ebbitt Grill rounded off the evening, before an early night ahead of a big day of travelling.","photos":[],"ts":1790853359754},{"id":"d5-gettysburg","day":5,"title":"","text":"An exciting day as our road trip truly began with us picking up our beautiful red Jeep.\n\nFirst stop: Gettysburg. After yesterday’s visit to Arlington, another cemetery felt a little bleak. But the museum was beautifully done, bringing to life the Civil War, the Battle of Gettysburg and Lincoln’s famous address.\n\nBonus points for the hot dog I enjoyed on the patio in the 27-degree sunshine!","photos":[{"thumb":"scrapbook-media/f83d913c2b945900-t.jpg","full":"scrapbook-media/f83d913c2b945900-f.jpg","w":1200,"h":1600,"cap":"Pointing out the Soldiers’ National Monument"},{"thumb":"scrapbook-media/b0dad57dc865aec9-t.jpg","full":"scrapbook-media/b0dad57dc865aec9-f.jpg","w":1200,"h":1600,"cap":"Abe again, at Gettysburg"},{"thumb":"scrapbook-media/a108bcdf0b97ec63-t.jpg","full":"scrapbook-media/a108bcdf0b97ec63-f.jpg","w":1200,"h":1600,"cap":"The battlefield, quiet now"}],"ts":1791029409497},{"id":"d5-bethlehem-steel","day":5,"title":"","text":"We continued across Pennsylvania to the abandoned ironworks at Bethlehem Steel. The massive furnaces told a story of industrial might followed by steep decline, echoed in Billy Joel’s Allentown. At its peak, 30,000 people worked there.","photos":[{"thumb":"scrapbook-media/578dafa0149d4130-t.jpg","full":"scrapbook-media/578dafa0149d4130-f.jpg","w":1200,"h":1600,"cap":"Dwarfed by the blast furnaces"},{"thumb":"scrapbook-media/385239104bf5fd77-t.jpg","full":"scrapbook-media/385239104bf5fd77-f.jpg","w":1200,"h":1600,"cap":"Bethlehem Steel’s rusting giants"}],"ts":1791029409498},{"id":"d5-new-jersey","day":5,"title":"","text":"Billy was keen to see his mother’s family home before sunset, so we pressed on towards New Jersey as the light faded. Arriving just in time, we saw the old house, met former neighbours and visited her old school. A lovely, personal visit to the American suburbia you see in the movies.\n\nAfter a long day on the road, we headed north to our final stop, the Bear Mountain Inn, for dinner and some much-needed sleep.","photos":[],"ts":1791029409499}]}</script>
<script>
"use strict";
var PAGE_UPDATED = '2026-09-28';
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function safeSrc(s){ return /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(s || '') ? s : ''; }
var BEHAVIOR = (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'auto' : 'smooth';

var DAYS = [
  ['Sun 27 Sept','Wheels down in Washington'],
  ['Mon 28 Sept','The Mall, the memorials & the Archives'],
  ['Tue 29 Sept','Capitol Hill'],
  ['Wed 30 Sept','Arlington'],
  ['Thu 1 Oct','Gettysburg, the steel & the Hudson'],
  ['Fri 2 Oct','West Point, FDR & Zach Bryan'],
  ['Sat 3 Oct','North into the mountains'],
  ['Sun 4 Oct','The Cog, the Gold Room & the lake'],
  ['Mon 5 Oct','The Kanc, the train & into the fair'],
  ['Tue 6 Oct','Fryeburg Fair, then Maine'],
  ['Wed 7 Oct','Portland'],
  ['Thu 8 Oct','The Maine day trip'],
  ['Fri 9 Oct','Salem, then Boston'],
  ['Sat 10 Oct','Revolution, hockey, home']
];

/* The seven beds. x/y match the map; days = diary days filed under this stop;
   ann = where the "we're here!" note sits when this is the current stop. */
var STOPS = [
 {name:'Washington DC', x:66.6, y:586, hit:24, days:[1,2,3,4],
  stay:'Hilton Garden Inn Downtown', when:'Sun 27 Sept – Thu 1 Oct · 4 nights',
  note:'Three blocks from the White House. Marble, museums and the machinery of the republic.',
  ann:{x:92, y:546, a:'start', ax:90, ay:564}},
 {name:'West Point', x:265, y:346.9, hit:24, days:[5],
  stay:'Bear Mountain Inn — Overlook Lodge', when:'Thu 1 Oct · 1 night',
  note:'Reached via Gettysburg’s battlefield and Bethlehem’s blast furnaces. A 1915 lodge above Hessian Lake — the first mile of the Appalachian Trail runs through the grounds.',
  ann:{x:283, y:316, a:'start', ax:281, ay:333}},
 {name:'Gillette Stadium', x:425.8, y:264.6, hit:18, days:[6],
  stay:'Holiday Inn Express, Milford', when:'Fri 2 Oct · 1 night',
  note:'The big Friday: West Point at ten, FDR’s Springwood at lunch, then Zach Bryan at Gillette Stadium — twenty minutes from this bed.',
  ann:{x:410, y:294, a:'end', ax:413, ay:283}},
 {name:'North Woodstock', x:414.9, y:76.3, hit:22, days:[7,8],
  stay:'Woodstock Inn Brewery', when:'Sat 3 – Mon 5 Oct · 2 nights',
  note:'Sleeping above our own brewpub at the mouth of Franconia Notch — base for the Cog Railway, the Gold Room at Bretton Woods, and Lonesome Lake.',
  ann:{x:404, y:108, a:'end', ax:407, ay:96}},
 {name:'Fryeburg Fair', x:460.8, y:77.6, hit:22, days:[9,10],
  stay:'The Oxford House Inn', when:'Mon 5 Oct · 1 night',
  note:'A 1913 inn fifteen minutes’ walk from the Fryeburg Fair gate — we sleep inside fair week, in from the Kancamagus and the Crawford Notch train.',
  ann:{x:422, y:30, a:'end', ax:427, ay:38}},
 {name:'Portland', x:506, y:112.4, hit:22, days:[10,11,12],
  stay:'Somewhere in the Old Port (to be booked)', when:'Tue 6 – Fri 9 Oct · 3 nights',
  note:'Lighthouses, lobster, and the best small food city on the route.',
  ann:{x:550, y:160, a:'end', ax:514, ay:146}},
 {name:'Boston', x:455.8, y:243.2, hit:18, days:[13,14],
  stay:'The Royal Sonesta', when:'Fri 9 Oct · 1 night',
  note:'In via Salem’s Haunted Happenings; then the Freedom Trail, a Bruins matinee, and the flight home.',
  ann:{x:478, y:210, a:'start', ax:476, ay:226}}
];
var DAY_STOP = {1:0,2:0,3:0,4:0,5:1,6:2,7:3,8:3,9:4,10:5,11:5,12:5,13:6,14:6};
/* planned road miles per trip day (no car in DC; returned in Boston on day 13) */
var DAY_MILES = {5:305,6:200,7:165,8:60,9:45,10:50,11:50,12:120,13:105};
/* the day each of DC + 8 states is first reached */
var STATE_DAYS = [1,5,5,5,5,6,6,7,9];

/* ---- the diary: plain JSON in the aa-state block ---- */
var STATE = {entries:[]}, HERE = null;
try {
  var st = JSON.parse($('aa-state').textContent);
  if (st && Array.isArray(st.entries)) STATE = st;
} catch(e){}
/* a password saved back when the page had one */
try { localStorage.removeItem('aa-scrapbook-pw'); } catch(e){}

/* ---- time where we are (US Eastern) ---- */
function etNow(){
  var p = {};
  try {
    new Intl.DateTimeFormat('en-US', {timeZone:'America/New_York', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23'})
      .formatToParts(new Date()).forEach(function(x){ p[x.type] = x.value; });
    return {y:+p.year, m:+p.month, d:+p.day, h:+p.hour % 24, min:+p.minute};
  } catch(e){
    var n = new Date();
    return {y:n.getFullYear(), m:n.getMonth() + 1, d:n.getDate(), h:n.getHours(), min:n.getMinutes()};
  }
}
function tripDay(){
  var t = etNow();
  return Math.round((Date.UTC(t.y, t.m - 1, t.d) - Date.UTC(2026, 8, 27)) / 86400000) + 1;
}

/* ---- boot ---- */
function boot(){
  var d = tripDay();
  HERE = (d >= 1 && d <= 14) ? DAY_STOP[d] : null;
  $('status').textContent = statusLine(d);
  drawMap();
  selectStop(HERE !== null ? HERE : (d > 14 ? 6 : 0), true);
  renderUpdated();
  document.querySelectorAll('[data-go]').forEach(function(b){
    b.addEventListener('click', function(){
      var go = b.getAttribute('data-go');
      if (go === 'map') $('mapCard').scrollIntoView({behavior:BEHAVIOR, block:'start'});
      else if (go === 'diary'){ showDiary(); $('panel').scrollIntoView({behavior:BEHAVIOR, block:'start'}); }
      else if (go === 'photos'){ showPhotos(); $('panel').scrollIntoView({behavior:BEHAVIOR, block:'start'}); }
    });
  });
}
function roadMiles(d){
  var total = 0, k;
  if (d < 1) return 0;
  if (d > 14){ for (k in DAY_MILES) total += DAY_MILES[k]; return total; }
  for (k = 1; k < d; k++) total += DAY_MILES[k] || 0;
  if (DAY_MILES[d]){
    var t = etNow();
    total += DAY_MILES[d] * Math.min(1, Math.max(0, (t.h + t.min / 60 - 8) / 11));
  }
  return Math.round(total);
}
function statusLine(d){
  if (d < 1) return 'We leave in ' + (1 - d) + ' day' + (1 - d === 1 ? '' : 's') + '. The diary starts on 27 September.';
  var states = STATE_DAYS.filter(function(x){ return x <= d; }).length;
  var miles = roadMiles(d);
  if (d > 14) return 'Fourteen days, about ' + miles.toLocaleString('en-GB') + ' road miles, eight states and D.C. Thanks for reading.';
  var m = d < 5 ? 'no road miles yet (the car arrives Thursday)' : 'about ' + miles.toLocaleString('en-GB') + ' road miles';
  return 'Day ' + d + ' of 14: ' + DAYS[d - 1][1] + '. So far, ' + states + ' of 9 states (D.C. counts) and ' + m + '.';
}

/* ---- the map ---- */
var SVGNS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, text){
  var n = document.createElementNS(SVGNS, tag);
  for (var k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  return n;
}
function drawMap(){
  var ring = $('ringLayer'), pins = $('pinLayer'), ann = $('annLayer'), hits = $('hitLayer');
  ring.textContent = ''; pins.textContent = ''; ann.textContent = ''; hits.textContent = '';
  STOPS.forEach(function(s, i){
    pins.appendChild(el('circle', {cx:s.x, cy:s.y, r:7.5, fill: i === HERE ? '#A63A0C' : '#2E2419', stroke:'#FBF4E4', 'stroke-width':2.5}));
    var g = el('g', {'class':'stop-hit', 'data-si':i, tabindex:0, role:'button', 'aria-label':s.name + ': ' + s.stay});
    g.appendChild(el('title', {}, s.name + ' — tap to open its page'));
    g.appendChild(el('circle', {cx:s.x, cy:s.y, r:s.hit, fill:'transparent'}));
    g.addEventListener('click', function(){ selectStop(i, false); });
    g.addEventListener('keydown', function(ev){ if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); selectStop(i, false); } });
    hits.appendChild(g);
  });
  if (HERE === null) return;
  var s = STOPS[HERE], a = s.ann;
  ring.appendChild(el('circle', {cx:s.x, cy:s.y, r:12, fill:'none', stroke:'#A63A0C', 'stroke-width':2.5, 'class':'pin-pulse'}));
  var t = el('text', {x:a.x, y:a.y, 'text-anchor':a.a, 'class':'ann'});
  t.appendChild(el('tspan', {x:a.x, dy:0}, 'we’re'));
  t.appendChild(el('tspan', {x:a.x, dy:19}, 'here!'));
  ann.appendChild(t);
  var dx = s.x - a.ax, dy = s.y - a.ay, L = Math.sqrt(dx * dx + dy * dy) || 1;
  var ex = s.x - dx / L * 12, ey = s.y - dy / L * 12;
  var mx = (a.ax + ex) / 2 - dy / L * 7, my = (a.ay + ey) / 2 + dx / L * 7;
  ann.appendChild(el('path', {d:'M' + a.ax + ',' + a.ay + ' Q' + mx.toFixed(1) + ',' + my.toFixed(1) + ' ' + ex.toFixed(1) + ',' + ey.toFixed(1),
    fill:'none', stroke:'#A63A0C', 'stroke-width':1.8, 'stroke-linecap':'round'}));
  var hx = ex - dx / L * 7, hy = ey - dy / L * 7, px = -dy / L * 4, py = dx / L * 4;
  ann.appendChild(el('path', {d:'M' + (hx + px).toFixed(1) + ',' + (hy + py).toFixed(1) + ' L' + ex.toFixed(1) + ',' + ey.toFixed(1) + ' L' + (hx - px).toFixed(1) + ',' + (hy - py).toFixed(1),
    fill:'none', stroke:'#A63A0C', 'stroke-width':1.8, 'stroke-linecap':'round', 'stroke-linejoin':'round'}));
}
function markSelected(i){
  var sl = $('selLayer');
  sl.textContent = '';
  if (i == null) return;
  var s = STOPS[i];
  sl.appendChild(el('ellipse', {cx:s.x, cy:s.y, rx:16, ry:13, transform:'rotate(-14 ' + s.x + ' ' + s.y + ')', fill:'none', stroke:'#2E2419', 'stroke-width':1.8}));
  sl.appendChild(el('ellipse', {cx:s.x + 1, cy:s.y - .5, rx:15, ry:14, transform:'rotate(12 ' + s.x + ' ' + s.y + ')', fill:'none', stroke:'#2E2419', 'stroke-width':1.1, opacity:.6}));
}

/* ---- a stop's page, the diary, the photos ---- */
function entriesForDay(day){
  return (STATE.entries || []).filter(function(e){ return e.day === day; })
    .sort(function(a, b){ return (a.ts || 0) - (b.ts || 0); });
}
function safePath(p){ return /^scrapbook-media\/[a-f0-9]{16}-[tf]\.jpg$/.test(p || '') ? p : ''; }
function photoOk(p){ return !!(p && (safeSrc(p.src) || (safePath(p.thumb) && safePath(p.full)))); }
function printHtml(p, day){
  var src = p.thumb ? 'loading="lazy" src="' + safePath(p.thumb) + '" data-full="' + safePath(p.full) + '"'
                    : 'src="' + safeSrc(p.src) + '"';
  return '<figure class="print"><span class="tape" aria-hidden="true"></span><img alt="' + esc(p.cap || 'Trip photo') + '" ' + src + '>' +
    '<figcaption>' + (p.cap ? esc(p.cap) : '&nbsp;') + (day ? '<span class="label">Day ' + day + ' · ' + esc(DAYS[day - 1][0]) + '</span>' : '') + '</figcaption></figure>';
}
function isNew(e){ return !!e.ts && (Date.now() - e.ts) < 36 * 3600 * 1000; }
function entryHtml(e){
  var h = '<div class="entry">';
  if (e.title) h += '<h3>' + esc(e.title) + '</h3>';
  if (e.text) h += '<p>' + esc(e.text) + '</p>';
  var ps = (e.photos || []).filter(photoOk);
  if (ps.length) h += '<div class="prints">' + ps.map(function(p){ return printHtml(p, 0); }).join('') + '</div>';
  return h + '</div>';
}
function dayHtml(day, es){
  return '<section class="day"><h3 class="day-h"><b>Day ' + day + '</b><span class="label">' + esc(DAYS[day - 1][0]) + ' · ' + esc(DAYS[day - 1][1]) + '</span>' +
    (es.some(isNew) ? '<span class="stamp">New</span>' : '') + '</h3>' + es.map(entryHtml).join('') + '</section>';
}
function setPressed(which){
  document.querySelectorAll('[data-go][aria-pressed]').forEach(function(b){
    b.setAttribute('aria-pressed', b.getAttribute('data-go') === which ? 'true' : 'false');
  });
}
function wirePanel(){
  var body = $('panelBody');
  body.querySelectorAll('.print img').forEach(function(img){
    img.addEventListener('error', function(){ img.classList.add('missing'); });
    img.addEventListener('click', function(){ if (!img.classList.contains('missing')) openLightbox(img); });
  });
  body.querySelectorAll('[data-to]').forEach(function(b){
    b.addEventListener('click', function(){ selectStop(+b.getAttribute('data-to'), false); });
  });
}
function selectStop(i, quiet){
  markSelected(i);
  setPressed(null);
  var s = STOPS[i], isHere = i === HERE, d = tripDay(), n = STOPS.length;
  var h = '<div class="stop-head"><div class="stop-title"><h2>' + esc(s.name) + '</h2>' + (isHere ? '<span class="stamp">We’re here</span>' : '') + '</div>' +
    '<dl class="facts"><dt class="label">Staying at</dt><dd>' + esc(s.stay) + '</dd><dt class="label">When</dt><dd>' + esc(s.when) + '</dd></dl>' +
    '<p class="blurb">' + esc(s.note) + '</p></div>';
  var any = false;
  s.days.forEach(function(day){
    var es = entriesForDay(day);
    if (es.length){ any = true; h += dayHtml(day, es); }
  });
  if (!any){
    h += '<p class="empty">' + esc(isHere ? 'Nothing written here yet — we’re still living it. Check back tonight!'
      : s.days[0] > d ? 'We haven’t got here yet. This page fills in from ' + DAYS[s.days[0] - 1][0] + '.'
      : 'Nothing written here yet — Matt’s catching up.') + '</p>';
  }
  var prev = (i + n - 1) % n, next = (i + 1) % n;
  h += '<nav class="pager" aria-label="Other stops"><button type="button" data-to="' + prev + '">← ' + esc(STOPS[prev].name) + '</button>' +
    '<button type="button" data-to="' + next + '">' + esc(STOPS[next].name) + ' →</button></nav>';
  $('panelBody').innerHTML = h;
  wirePanel();
  if (!quiet) $('panel').scrollIntoView({behavior:BEHAVIOR, block:'start'});
}
function showDiary(){
  markSelected(null);
  setPressed('diary');
  var h = '<h2 class="view-h">The whole diary</h2>', any = false;
  for (var day = 1; day <= 14; day++){
    var es = entriesForDay(day);
    if (es.length){ any = true; h += dayHtml(day, es); }
  }
  if (!any) h += '<p class="empty">Nothing written yet. Entries appear here as the trip unfolds — check back tonight.</p>';
  $('panelBody').innerHTML = h;
  wirePanel();
}
function showPhotos(){
  markSelected(null);
  setPressed('photos');
  var shots = [];
  for (var day = 1; day <= 14; day++){
    entriesForDay(day).forEach(function(e){
      (e.photos || []).forEach(function(p){ if (photoOk(p)) shots.push(printHtml(p, day)); });
    });
  }
  $('panelBody').innerHTML = '<h2 class="view-h">All the photos</h2>' +
    (shots.length ? '<div class="prints wall">' + shots.join('') + '</div>' : '<p class="empty">No photos yet — they’re coming, promise.</p>');
  wirePanel();
}
function renderUpdated(){
  var ts = Date.parse(PAGE_UPDATED + 'T16:00:00Z');
  (STATE.entries || []).forEach(function(e){ if (e.ts > ts) ts = e.ts; });
  var s;
  try { s = new Date(ts).toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric', timeZone:'America/New_York'}); }
  catch(e){ s = new Date(ts).toDateString(); }
  $('lastUpd').textContent = s;
}

/* ---- a photo, enlarged ---- */
function openLightbox(img){
  var cap = img.alt && img.alt !== 'Trip photo' ? img.alt : '';
  var lb = document.createElement('div');
  lb.id = 'lb';
  lb.setAttribute('role', 'dialog');
  lb.setAttribute('aria-label', cap || 'Photo');
  lb.innerHTML = '<figure class="lb-print"><img alt="' + esc(cap || 'Trip photo') + '">' + (cap ? '<figcaption>' + esc(cap) + '</figcaption>' : '') + '</figure><div class="lb-hint">tap anywhere to close</div>';
  var big = lb.querySelector('img');
  big.src = img.currentSrc || img.src;
  var full = img.getAttribute('data-full');
  if (full){
    /* show the preview at once, swap in the full-size photo when it arrives */
    var pre = new Image();
    pre.onload = function(){ big.src = full; };
    pre.src = full;
  }
  lb.addEventListener('click', function(){ lb.remove(); });
  document.body.appendChild(lb);
}
document.addEventListener('keydown', function(ev){
  if (ev.key === 'Escape'){ var lb = $('lb'); if (lb) lb.remove(); }
});

boot();
</script>
</body>
</html>
